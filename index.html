<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Miles!</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fed6e3 0%, #a8c1ef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Card Container */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        /* Image Styling */
        .card-image-container {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0 25px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 4px solid #white;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        /* Decorative Elements */
        .emoji-banner {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        /* Typography */
        h1 {
            color: #ff4a75;
            font-size: 2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .recipient {
            color: #3b5998;
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: block;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Pulsing Heart Animation */
        .heart {
            color: #ff4a75;
            font-size: 3rem;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }

        /* Keyframes Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Background Decorative Balloons using CSS */
        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50%;
            opacity: 0.25;
            z-index: -1;
            animation: floatup 8s infinite linear;
        }

        .b1 { background: #ff4a75; left: 10%; bottom: -100px; animation-duration: 12s; }
        .b2 { background: #3b5998; left: 85%; bottom: -120px; animation-duration: 10s; animation-delay: 2s; }
        .b3 { background: #ffb703; left: 50%; bottom: -150px; animation-duration: 14s; animation-delay: 1s; }

        @keyframes floatup {
            0% { bottom: -100px; transform: translateX(0); }
            50% { transform: translateX(30px); }
            100% { bottom: 110vh; transform: translateX(-30px); }
        }
    </style>
</head>
<body>

    <!-- Floating Background Balloons -->
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>

    <!-- Birthday Card Box -->
    <div class="card">
        <span class="emoji-banner">🎂🎉🎈</span>
        <h1>Happy Birthday</h1>
        <span class="recipient">Miles!</span>
        
        <!-- Embedded Image Layer -->
        <div class="card-image-container">
            <img class="card-image" src="image_B7Sy5y.png" alt="Miles">
        </div>

        <p>Wishing you a wonderful day filled with joy, laughter, and everything you love.</p>
        <div class="heart">❤️</div>
        <p style="margin-top: 10px; font-weight: bold; color: #ff4a75; font-size: 1.3rem;">I love you</p>
    </div>

</body>
</html>
